<!DOCTYPE html>
<html>
<head>
    <title>Test Import</title>
</head>
<body>
    <h1>Test Import Egresos</h1>
    <button onclick="testImport()">Test Import</button>
    <pre id="result"></pre>

    <script>
        async function testImport() {
            const data = [
                {
                    proveedor: "Test Frontend 1",
                    categoria: "Servicios",
                    descripcion: "Test desde HTML",
                    tipoComprobante: "Factura",
                    montoTotal: 999,
                    montoPagado: 999,
                    deuda: 0,
                    tipoMoneda: "PEN",
                    fechaRegistro: "2025-12-03"
                }
            ];

            try {
                const response = await fetch('https://api.munnaymedicinaestetica.com/api/expenses/bulk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
                
                console.log('Response:', result);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
